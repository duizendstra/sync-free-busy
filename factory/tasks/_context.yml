# factory/tasks/_context.yml
version: '3'

tasks:
  # This single helper task is called by all `context:*` tasks in the root Taskfile.
  # It receives the specific mode (e.g., 'export-code') via CLI_ARGS.
  helper:
    internal: true
    desc: "Internal helper to run the main context script."
    cmds:
      - ./factory/scripts/context.sh {{.CLI_ARGS}}
